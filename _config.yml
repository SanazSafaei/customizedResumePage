# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Sanaz Safaei
email: sanaz.safaei@studenti.polito.it
description: >- # this means to ignore newlines until "baseurl:"
  Sanaz Safaei is a Backend Software Engineer with nearly 6 years of experience scaling high-traffic e-commerce systems at Digikala (17M+ daily sessions) with Java, Spring Boot, PHP, and Kubernetes. M.Sc. student at Politecnico di Torino.
github_username: SanazSafaei
minimal_mistakes_skin: default
locale: "en-US"
og_image: "/assets/images/bio-photo-2.jpg"
# Tells search engines which profiles belong to the same person (schema.org sameAs)
social:
  type: Person
  name: "Sanaz Safaei"
  links:
    - "https://www.linkedin.com/in/sanaz-safaei/"
    - "https://github.com/SanazSafaei"
search: false
url: "https://www.safaei.me"
baseurl: ""
twitter:
  username: "SanazSafaei"
  card: "summary_large_image"
google_site_verification: ""

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:title/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - README.md
  - guide.md

# Plugins (previously gems:)
plugins:
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-robots-txt

author:
  name   : "Sanaz Safaei"
  avatar : "/assets/images/bio-photo-2.jpg"
  bio    : "Backend Software Engineer with nearly 6 years of experience building scalable, high-traffic systems with Java, Spring Boot, and PHP. M.Sc. student in Computer Engineering (AI & Data Analytics) at Politecnico di Torino."
  location: "Turin, Italy"
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://www.safaei.me"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/SanazSafaei"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/sanaz-safaei"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:sanaz.safaei@studenti.polito.it"

footer:
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://www.safaei.me"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/SanazSafaei"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/sanaz-safaei"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:sanaz.safaei@studenti.polito.it"

defaults:
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
